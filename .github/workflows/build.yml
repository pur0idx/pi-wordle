dev.py up --skip-metabase# On every push to main: run all tests, then build multi-arch images
# (arm64 for the Pis, amd64 for x86 notebooks) and push them to GHCR as
#   ghcr.io/<owner>/kube-guess-<service>:latest and :<git-sha>
# then deploy that exact <git-sha> to the Pi cluster through the self-hosted
# runner on the master VM (installed by scripts/cluster-up.sh, which also sets
# the repository variable DEPLOY_TO_PI=true; until then the job is skipped).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: (cd services/evaluator && npm ci)
      - run: scripts/test.sh

  images:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, gateway, word-service, evaluator, hint-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kube-guess-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          target: ${{ (matrix.service == 'gateway' || matrix.service == 'hint-engine') && 'runtime' || '' }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: images
    if: github.event_name != 'pull_request' && vars.DEPLOY_TO_PI == 'true'
    # GitHub's own runners cannot reach the Pi LAN; this one runs on the master.
    runs-on: [self-hosted, kube-guess]
    concurrency: { group: deploy-pi, cancel-in-progress: false }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/deploy.sh pi
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
